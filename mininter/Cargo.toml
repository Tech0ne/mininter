[package]
name = "mininter"
version = "0.1.0"
edition = "2024"
description = "A MiniScript compiler/interpreter, writen in pure rust, with easy to use API"
license = "MIT"

repository = "https://github.com/Tech0ne/mininter"
authors = ["Tech0ne"]

[dependencies]
mininter-macros = { version = "0.1.0", optional = true }
rand = { version = "0.10.3", optional = true }

[features]
default = ["macros", "rand"]
macros = ["dep:mininter-macros"]
rand = ["dep:rand"]
